name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CityEscapeQuest.slnx
      - name: Build
        run: dotnet build CityEscapeQuest.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test CityEscapeQuest.slnx --configuration Release --no-build

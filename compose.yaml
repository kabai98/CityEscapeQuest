services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${CEQ_SQL_SA_PASSWORD:?Set CEQ_SQL_SA_PASSWORD before starting Docker Compose}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
